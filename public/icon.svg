<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Source for all app icons. Regenerate with: npm run tauri icon src-tauri/icons/app-icon.svg -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a8af4"/>
      <stop offset="1" stop-color="#1c48a8"/>
    </linearGradient>
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="0" y1="360" x2="0" y2="680">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#f0a800"/>
    </linearGradient>
    <!-- Punches the hole through the key's bow so the background shows. -->
    <mask id="hole">
      <rect width="1024" height="1024" fill="#fff"/>
      <circle cx="318" cy="512" r="58" fill="#000"/>
    </mask>
  </defs>

  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>

  <!-- Soft shadow under the key -->
  <g transform="translate(14 22) rotate(-45 512 512)" fill="#0b2a6b" opacity="0.35" mask="url(#hole)">
    <circle cx="340" cy="512" r="150"/>
    <rect x="450" y="474" width="380" height="76" rx="18"/>
    <rect x="712" y="540" width="62" height="118" rx="12"/>
    <rect x="618" y="540" width="62" height="84" rx="12"/>
  </g>

  <!-- Key -->
  <g transform="rotate(-45 512 512)" fill="url(#gold)" mask="url(#hole)">
    <circle cx="340" cy="512" r="150"/>
    <rect x="450" y="474" width="380" height="76" rx="18"/>
    <rect x="712" y="540" width="62" height="118" rx="12"/>
    <rect x="618" y="540" width="62" height="84" rx="12"/>
  </g>
</svg>
